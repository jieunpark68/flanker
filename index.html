<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flanker Task</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Flanker: same look as the Sentence Sense test for setup screens; dark, distraction-free screen for trials. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#16263D; --muted:#5A6B82; --line:#C9D7E8;
  --navy:#1D4E89; --sea:#5EC4F0; --good:#2F8A4A; --goodbg:#E3F4E7; --warn:#B4541F; --warnbg:#FCEBDD;
  --stage:#111827; --stageInk:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.5;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.5vw,40px);line-height:1.05;margin:0;color:var(--navy)}
h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--navy)}
.tag{font-family:var(--display);font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px;background:var(--navy);color:#fff}
.tag.practice{background:var(--good)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input{font-family:var(--read);font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.field input:focus{outline:3px solid var(--sea);outline-offset:1px}
.dob{display:flex;align-items:center;gap:8px}
.dob input{font-family:var(--read);font-size:22px;width:3.4em;text-align:center;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.dob input.yr{width:4.6em}
.dob span{font-size:22px;color:var(--muted)}
#dobMsg{color:var(--warn);font-weight:700}
.note{font-size:15px;color:var(--muted);margin:0}
.script{background:var(--bg);border-left:5px solid var(--navy);padding:12px 16px;border-radius:8px;font-size:19px;margin:0;flex:1;min-width:0}
.dirRow{display:flex;align-items:center;gap:12px}
.spkBig{font-size:28px;min-width:64px;min-height:64px;border-radius:16px;border:3px solid var(--navy);background:var(--bg);cursor:pointer;flex:none}
.demo{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.demoBox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--stage);color:#fff;border-radius:16px;padding:14px 20px}
.demoBox small{color:#cbd5e1;font-size:15px}
.arrowsSm{display:flex;gap:4px}
.arrowsSm svg{width:30px;height:30px}
.arrowsSm .mid{outline:3px solid var(--sea);outline-offset:3px;border-radius:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--display);font-weight:800;font-size:19px;min-height:52px;padding:6px 22px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.go{background:var(--good);border-color:var(--good);color:#fff}
.btn.small{font-size:14px;min-height:36px;padding:4px 12px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.examiner{border-top:1px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.feedback{font-size:18px;font-weight:700;border-radius:12px;padding:10px 14px;margin:0}
.feedback:empty{display:none}
.feedback.good{background:var(--goodbg);color:var(--good)}
.feedback.try{background:var(--warnbg);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.center{text-align:center}
.choicesNext{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bigchoice{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px}
.bigchoice small{font-family:var(--read);font-weight:400;font-size:15px;opacity:.9}

/* ---------- trial screen ---------- */
#stage{position:fixed;inset:0;background:var(--stage);color:var(--stageInk);display:flex;flex-direction:column;z-index:10;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#stage[hidden]{display:none}
.stageTop{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-family:var(--display);font-size:16px;color:#94a3b8}
.stageTop .pill{background:#1f2937;border-radius:999px;padding:2px 12px}
.stageMid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:0}
.arrows{display:flex;gap:clamp(6px,1.6vw,14px);min-height:clamp(56px,11vw,96px)}
.arrows svg{width:clamp(56px,11vw,96px);height:clamp(56px,11vw,96px)}
.fix{width:40px;height:40px;position:relative}
.fix::before,.fix::after{content:"";position:absolute;background:#fff;border-radius:2px}
.fix::before{left:17px;top:0;width:6px;height:40px}
.fix::after{top:17px;left:0;height:6px;width:40px}
.fix.red::before,.fix.red::after{background:#ef4444}
.fix.hide{visibility:hidden}
.msg{min-height:64px;font-size:clamp(20px,4vw,30px);font-weight:700;text-align:center;font-family:var(--read)}
.msg.ok{color:#4ade80}.msg.bad{color:#fbbf24}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 0 18px}
.resp button{min-height:clamp(110px,18vh,170px);border-radius:24px;border:4px solid #334155;background:#1f2937;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.resp button svg{width:clamp(64px,10vw,96px);height:clamp(64px,10vw,96px)}
.resp button:active,.resp button.pressed{background:#334155;border-color:var(--sea)}
.resp button[disabled]{opacity:.55}
.stopBtn{background:none;border:1px solid #334155;color:#94a3b8;border-radius:8px;font-size:13px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="page">
  <header>
    <div><span class="eyebrow">Sentence Sense</span><h1 id="title">Flanker Task</h1></div>
    <span class="tag" id="modeTag" hidden></span>
  </header>
  <main id="screen"></main>
</div>

<!-- full-screen trial area -->
<section id="stage" hidden>
  <div class="stageTop"><span class="pill" id="stageInfo"></span><button class="stopBtn" id="stopBtn">Examiner: end early</button></div>
  <div class="stageMid">
    <div class="arrows" id="arrows" aria-live="off"></div>
    <div class="fix hide" id="fix"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="resp">
    <button id="bL" aria-label="Left"></button>
    <button id="bR" aria-label="Right"></button>
  </div>
</section>

<script>
/* ================= TASK SETTINGS (from the original PsyToolkit task) =================
   4 stimuli, respond to the MIDDLE arrow. Left = A key / left button, Right = L key / right button.
   Response window 2000 ms, 500 ms between trials. */
const STIMULI=[
  {code:"LLLLL",dirs:"LLLLL",target:"left", cond:"congruent"},
  {code:"RRRRR",dirs:"RRRRR",target:"right",cond:"congruent"},
  {code:"RRLRR",dirs:"RRLRR",target:"left", cond:"incongruent"},
  {code:"LLRLL",dirs:"LLRLL",target:"right",cond:"incongruent"}
];
const SETTINGS={
  practiceTrials:8,      // 2 of each stimulus, with feedback
  testTrials:48,         // 12 of each stimulus, balanced, no feedback
  responseWindow:2000,   // ms
  iti:500,               // ms blank between trials
  fixation:500,          // ms fixation cross before the arrows
  feedbackMs:900         // practice feedback display time
};

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function on(id,f){const e=document.getElementById(id);if(e)e.onclick=f}
const scr=$("#screen"),tag=$("#modeTag"),stage=$("#stage");
function arrowSVG(dir,color="#fff"){
  const flip=dir==="L"?' transform="scale(-1,1) translate(-100,0)"':"";
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g${flip}><path d="M10 42 H60 V22 L92 50 L60 78 V58 H10 Z" fill="${color}"/></g></svg>`;
}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function ageMonths(dob,date){const a=new Date(dob),b=new Date(date);if(isNaN(a)||isNaN(b))return"";let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;return m}
function shuffleNoLongRuns(arr){ // shuffle, avoiding more than 3 identical stimuli in a row
  for(let tries=0;tries<200;tries++){
    const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    let ok=true;for(let i=3;i<a.length;i++)if(a[i]===a[i-1]&&a[i]===a[i-2]&&a[i]===a[i-3]){ok=false;break}
    if(ok)return a;
  }return arr.slice();
}
function buildList(n){const per=n/4;return shuffleNoLongRuns([0,1,2,3].flatMap(k=>Array(per).fill(k)))}

/* ================= STORAGE (finished sessions kept on this iPad until saved) ================= */
const KEY="flanker-sessions";
function backups(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function storeBackup(s){try{const b=backups().filter(x=>x.id!==s.id);b.push(s);localStorage.setItem(KEY,JSON.stringify(b));return backups().some(x=>x.id===s.id)}catch(e){return false}}
function clearBackups(){try{localStorage.removeItem(KEY)}catch(e){}}
function getDevice(){try{return localStorage.getItem("ss-device")||""}catch(e){return""}}
function setDevice(v){try{localStorage.setItem("ss-device",v)}catch(e){}}

/* ================= STATE ================= */
let session=null, phase="setup", list=[], idx=0, trialLive=false, tOn=0, timer=null, stopArmed=false;

/* ================= SETUP ================= */
function setup(){
  phase="setup";tag.hidden=true;stage.hidden=true;
  const today=localDate(), saved=backups();
  scr.innerHTML=`<section class="card">
    <h2>Student information</h2>
    <div class="row">
      <div class="field"><label for="fname">First name</label><input id="fname" autocomplete="off" autocapitalize="words"></div>
      <div class="field"><label for="lname">Last name</label><input id="lname" autocomplete="off" autocapitalize="words"></div>
    </div>
    <div class="field"><label for="dobM">Date of birth</label>
      <div class="dob">
        <input id="dobM" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Birth month" autocomplete="off"><span>/</span>
        <input id="dobD" inputmode="numeric" maxlength="2" placeholder="DD" aria-label="Birth day" autocomplete="off"><span>/</span>
        <input id="dobY" class="yr" inputmode="numeric" maxlength="4" placeholder="YYYY" aria-label="Birth year" autocomplete="off">
      </div>
      <span class="note" id="dobMsg"></span>
    </div>
    <p class="note">${SETTINGS.practiceTrials} practice trials with feedback, then ${SETTINGS.testTrials} test trials. About 4 minutes.</p>
    <div class="actions"><button class="btn primary" id="begin" disabled>Start</button></div>
    <div class="examiner">
      <label for="device">iPad number</label>
      <input id="device" autocomplete="off" maxlength="10" value="${esc(getDevice())}" placeholder="e.g. 7" style="width:5em;font-size:16px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)">
      <span style="flex:1"></span>
      <span>${saved.length} student${saved.length===1?"":"s"} saved on this iPad</span>
      <button class="btn small" id="eodBtn">End of the day</button>
    </div>
  </section>`;
  const fn=$("#fname"),ln=$("#lname"),go=$("#begin"),dM=$("#dobM"),dD=$("#dobD"),dY=$("#dobY"),dMsg=$("#dobMsg");
  const readDob=()=>{
    const m=dM.value,d=dD.value,y=dY.value;if(!m||!d||y.length<4){dMsg.textContent="";return""}
    const mm=+m,dd=+d,yy=+y,dt=new Date(yy,mm-1,dd);
    if(!(mm>=1&&mm<=12)||dt.getMonth()!==mm-1||dt.getDate()!==dd){dMsg.textContent="That date doesn't exist. Check the month and day.";return""}
    const age=(Date.now()-dt)/31557600000;
    if(age<3||age>14){dMsg.textContent="Check the year. This student would be "+Math.max(0,Math.floor(age))+" years old.";return""}
    dMsg.textContent="";return `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  };
  const ok=()=>go.disabled=!(fn.value.trim()&&ln.value.trim()&&readDob());
  [fn,ln].forEach(e=>e.oninput=ok);
  [[dM,dD],[dD,dY],[dY,null]].forEach(([el,nx])=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"");if(nx&&el.value.length===el.maxLength)nx.focus();ok()}});
  go.onclick=()=>{
    const f=fn.value.trim(),l=ln.value.trim();
    session={id:Date.now().toString(36),first:f,last:l,dob:readDob(),date:today,device:getDevice(),
      start:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),status:"completed",practiceRounds:0,trials:[]};
    practiceIntro();
  };
  const dev=$("#device");dev.oninput=()=>setDevice(dev.value.trim());
  on("eodBtn",showEndOfDay);
  fn.focus();
}

/* ================= INSTRUCTIONS ================= */
function demoHTML(){
  const row=(dirs)=>`<div class="arrowsSm">${[...dirs].map((d,i)=>`<span class="${i===2?"mid":""}">${arrowSVG(d)}</span>`).join("")}</div>`;
  return `<div class="demo">
    <div class="demoBox">${row("RRRRR")}<small>Middle points right → tap <b>➡</b></small></div>
    <div class="demoBox">${row("RRLRR")}<small>Middle points left → tap <b>⬅</b></small></div>
  </div>`;
}
function dirBlock(text){
  return `<p class="note">Read to the student, or tap the speaker to play it:</p>
  <div class="dirRow"><button class="spkBig" id="readScript" aria-label="Hear the directions">🔊</button><p class="script" id="scriptText">${text}</p></div>`;
}
function practiceIntro(){
  phase="intro";tag.hidden=false;tag.textContent="Practice";tag.className="tag practice";
  const name=esc(session.first);
  scr.innerHTML=`<section class="card">
    <h2>${session.practiceRounds?"Let's practice again!":"Let's practice!"}</h2>
    ${dirBlock(`Hi, ${name}! You will see five arrows in a row. Look only at the arrow in the middle. If the middle arrow points to the left, tap the left button. If it points to the right, tap the right button. Don't pay attention to the other arrows. Go as fast as you can, but try not to make mistakes.`)}
    ${demoHTML()}
    <div class="actions"><button class="btn go" id="go">Start practice</button></div>
  </section>`;
  on("readScript",()=>speak($("#scriptText").textContent));
  on("go",()=>{session.practiceRounds++;runBlock("practice")});
}
function testIntro(){
  phase="intro";tag.hidden=false;tag.textContent="Test";tag.className="tag";
  scr.innerHTML=`<section class="card">
    <h2>Great practicing!</h2>
    ${dirBlock(`Now let's do the real game. This time I won't tell you if you are right or wrong. Remember, look only at the middle arrow. Go as fast as you can without making mistakes. Ready?`)}
    ${demoHTML()}
    <div class="actions"><button class="btn primary" id="go">Start test</button></div>
  </section>`;
  on("readScript",()=>speak($("#scriptText").textContent));
  on("go",()=>runBlock("test"));
}

/* ================= TRIALS ================= */
$("#bL").innerHTML=arrowSVG("L");$("#bR").innerHTML=arrowSVG("R");
function runBlock(which){
  phase=which;idx=0;stopArmed=false;$("#stopBtn").textContent="Examiner: end early";
  list=buildList(which==="practice"?SETTINGS.practiceTrials:SETTINGS.testTrials);
  stage.hidden=false;$("#stopBtn").hidden=which==="practice";
  setButtons(false);$("#arrows").innerHTML="";$("#msg").textContent="";$("#fix").classList.add("hide");
  setTimeout(nextTrial,800);
}
function setButtons(enabled){$("#bL").disabled=!enabled;$("#bR").disabled=!enabled}
function nextTrial(){
  if(phase!=="practice"&&phase!=="test")return;
  if(idx>=list.length){endBlock();return}
  $("#stageInfo").textContent=(phase==="practice"?"Practice ":"Trial ")+(idx+1)+" of "+list.length;
  const fix=$("#fix");fix.classList.remove("hide","red");$("#arrows").innerHTML="";$("#msg").textContent="";$("#msg").className="msg";
  setTimeout(()=>{
    if(phase!=="practice"&&phase!=="test")return;
    const s=STIMULI[list[idx]];
    $("#arrows").innerHTML=[...s.dirs].map(d=>arrowSVG(d)).join("");
    // timestamp the first frame where the arrows are actually painted
    requestAnimationFrame(()=>requestAnimationFrame(t=>{
      tOn=performance.now();trialLive=true;setButtons(true);
      timer=setTimeout(()=>respond(null),SETTINGS.responseWindow);
    }));
  },SETTINGS.fixation);
}
function respond(dir){
  if(!trialLive)return;
  const rt=dir?Math.round(performance.now()-tOn):"";
  trialLive=false;clearTimeout(timer);setButtons(false);
  const s=STIMULI[list[idx]];
  const correct=dir===s.target?1:0;
  session.trials.push({phase,trial:idx+1,stimulus:s.code,condition:s.cond,target:s.target,response:dir||"none",
    correct,rt,timeout:dir?0:1,round:phase==="practice"?session.practiceRounds:""});
  $("#arrows").innerHTML="";
  idx++;
  if(phase==="practice"){
    const m=$("#msg"),fix=$("#fix");
    if(correct){m.textContent="✓ Correct!";m.className="msg ok"}
    else if(!dir){m.textContent="Too slow! Tap faster next time.";m.className="msg bad";fix.classList.add("red")}
    else{m.textContent="Oops! Look at the middle arrow.";m.className="msg bad";fix.classList.add("red")}
    setTimeout(()=>{fix.classList.remove("red");setTimeout(nextTrial,SETTINGS.iti)},SETTINGS.feedbackMs);
  }else{
    $("#fix").classList.add("hide");
    setTimeout(nextTrial,SETTINGS.iti);
  }
}
$("#bL").addEventListener("pointerdown",e=>{e.preventDefault();respond("left")});
$("#bR").addEventListener("pointerdown",e=>{e.preventDefault();respond("right")});
document.addEventListener("keydown",e=>{
  if(stage.hidden)return;
  const k=e.key.toLowerCase();
  if(k==="a"||k==="arrowleft"){e.preventDefault();respond("left")}
  else if(k==="l"||k==="arrowright"){e.preventDefault();respond("right")}
});
$("#stopBtn").onclick=()=>{
  if(!stopArmed){stopArmed=true;$("#stopBtn").textContent="Tap again to end and save";return}
  clearTimeout(timer);trialLive=false;session.status=`stopped at trial ${idx+1}`;phase="done";stage.hidden=true;finish();
};
function endBlock(){
  stage.hidden=true;
  if(phase==="practice"){practiceResult();return}
  phase="done";finish();
}

/* ================= AFTER PRACTICE ================= */
function practiceResult(){
  phase="intro";
  const r=session.trials.filter(t=>t.phase==="practice"&&t.round===session.practiceRounds);
  const n=r.filter(t=>t.correct).length;
  const passed=n>=6;
  scr.innerHTML=`<section class="card">
    <h2>Practice done</h2>
    <p class="feedback ${passed?"good":"try"}">${n} of ${r.length} correct${passed?". Ready for the test.":". Consider practicing again before the test."}</p>
    <div class="examiner" style="border-top:none;padding-top:0">Examiner: if the student still seems unsure which arrow to look at, practice again.</div>
    <div class="actions">
      <button class="btn ${passed?"primary":""}" id="toTest">Go to the test</button>
      <button class="btn ${passed?"":"go"}" id="again">Practice again</button>
    </div>
  </section>`;
  on("toTest",testIntro);on("again",practiceIntro);
}

/* ================= RESULTS ================= */
function summarize(s){
  const t=s.trials.filter(x=>x.phase==="test");
  const by=c=>{const all=t.filter(x=>x.condition===c),ok=all.filter(x=>x.correct&&x.rt!=="");
    const mean=ok.length?Math.round(ok.reduce((a,x)=>a+x.rt,0)/ok.length):"";
    return{n:all.length,correct:all.filter(x=>x.correct).length,acc:all.length?Math.round(all.filter(x=>x.correct).length/all.length*100):"",rt:mean}};
  const con=by("congruent"),inc=by("incongruent");
  return{con,inc,effect:(con.rt!==""&&inc.rt!=="")?inc.rt-con.rt:"",total:t.filter(x=>x.correct).length,n:t.length,timeouts:t.filter(x=>x.timeout).length};
}
function finish(){
  tag.hidden=true;
  const kept=storeBackup(session), S=summarize(session);
  const fname=`Flanker_${(session.last+"_"+session.first).replace(/[^A-Za-z0-9]+/g,"_")}_${session.date}.csv`;
  scr.innerHTML=`<section class="card">
    <h2 class="center">All done. Great job, ${esc(session.first)}!</h2>
    <div class="examiner" style="flex-direction:column;align-items:stretch">
      <strong style="color:var(--ink)">Examiner summary</strong>
      <span>${esc(session.first+" "+session.last)} · DOB ${session.dob} · Age ${ageMonths(session.dob,session.date)} months · ${session.date} · ${esc(session.status)}</span>
      <div class="tablewrap"><table>
        <thead><tr><th>Condition</th><th>Accuracy</th><th>Mean RT (correct)</th></tr></thead>
        <tbody>
          <tr><td>Congruent</td><td>${S.con.correct} / ${S.con.n} (${S.con.acc}%)</td><td>${S.con.rt} ms</td></tr>
          <tr><td>Incongruent</td><td>${S.inc.correct} / ${S.inc.n} (${S.inc.acc}%)</td><td>${S.inc.rt} ms</td></tr>
          <tr><td><strong>Flanker effect</strong></td><td><strong>${S.total} / ${S.n} total</strong></td><td><strong>${S.effect} ms</strong></td></tr>
        </tbody></table></div>
      <span>Timeouts (no answer in 2 seconds): ${S.timeouts}</span>
      ${kept?`<p class="feedback good">✓ Results saved on this iPad.</p>`
            :`<p class="feedback try">✗ Results were NOT saved on this iPad (Private Browsing or storage is off). Tap Save this student now.</p>`}
      <p class="feedback" id="saveMsg"></p>
    </div>
  </section>
  <section class="card" style="margin-top:18px">
    <h2>Examiner: what's next?</h2>
    <div class="choicesNext">
      <button class="btn primary bigchoice" id="newS">Next student<small>Test another student on this iPad</small></button>
      ${kept?`<button class="btn bigchoice" id="eodBtn">End of the day →<small>Done testing? Save today's results</small></button>`
            :`<button class="btn go bigchoice" id="save">Save this student<small>Storage is off, so save now</small></button>`}
    </div>
    ${kept?`<button class="btn small" id="save" style="align-self:flex-start">Save this student only (CSV)</button>`:""}
  </section>`;
  on("save",()=>saveWithStatus(toCSV([session]),fname,"this student","saveMsg"));
  on("eodBtn",showEndOfDay);on("newS",setup);
}

/* ================= END OF THE DAY ================= */
function showEndOfDay(){
  phase="eod";tag.hidden=false;tag.textContent="Examiner";tag.className="tag";stage.hidden=true;
  const saved=backups(), dates=[...new Set(saved.map(s=>s.date))].sort();
  scr.innerHTML=`<section class="card">
    <h2>Save today's results</h2>
    <p class="note"><strong>${saved.length}</strong> student${saved.length===1?"":"s"} saved on this iPad${dates.length?` (${dates[0]}${dates.length>1?" to "+dates[dates.length-1]:""})`:""}${getDevice()?` · iPad ${esc(getDevice())}`:""}.</p>
    ${saved.length?`<div class="tablewrap"><table><thead><tr><th>Student</th><th>Date</th><th>Status</th></tr></thead><tbody>${saved.map(s=>`<tr><td>${esc(s.first+" "+s.last)}</td><td>${esc(s.date)}</td><td>${esc(s.status)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <ol class="note" style="margin:0;padding-left:20px;font-size:16px">
      <li>Tap <strong>Save all results</strong>, then choose OneDrive (or Save to Files).</li>
      <li>Check that the file is in OneDrive.</li>
      <li>Come back and tap <strong>Clear saved sessions</strong> so tomorrow starts fresh.</li>
    </ol>
    <div class="actions"><button class="btn primary" id="dlAll" ${saved.length?"":"disabled"}>Save all results (CSV)</button></div>
    <p class="feedback" id="eodMsg"></p>
    <div class="actions" id="afterSave" hidden><button class="btn" id="clr">Clear saved sessions</button></div>
    <p class="note" id="clrMsg" hidden>Only clear after the file is in OneDrive. Clearing cannot be undone.</p>
  </section>
  <div class="actions" style="margin-top:14px"><button class="btn" id="back">← Back to start</button></div>`;
  on("dlAll",()=>{
    const dev=getDevice().replace(/[^A-Za-z0-9]+/g,""),n=backups().length;
    saveWithStatus(toCSV(backups()),`Flanker_${dev?"iPad"+dev+"_":""}${localDate()}.csv`,`all ${n} student${n===1?"":"s"}`,"eodMsg")
      .then(r=>{if(r==="shared"||r==="downloaded"){$("#afterSave").hidden=false;$("#clrMsg").hidden=false}});
  });
  let armed=false;
  on("clr",()=>{if(!armed){armed=true;$("#clrMsg").textContent="Tap Clear again to delete all saved sessions from this iPad.";$("#clr").textContent="Yes, clear them";return}clearBackups();setup()});
  on("back",setup);
}

/* ================= CSV ================= */
function toCSV(sessions){
  const head=["first_name","last_name","dob","age_months","test_date","start_time","ipad","session_status",
    "phase","practice_round","trial","stimulus","condition","target","response","correct","rt_ms","timeout",
    "acc_congruent_pct","acc_incongruent_pct","rt_congruent_ms","rt_incongruent_ms","flanker_effect_ms"];
  const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const out=[head.join(",")];
  sessions.forEach(s=>{const S=summarize(s);
    s.trials.forEach(t=>out.push([s.first,s.last,s.dob,ageMonths(s.dob,s.date),s.date,s.start,s.device||"",s.status,
      t.phase,t.round,t.trial,t.stimulus,t.condition,t.target,t.response,t.correct,t.rt,t.timeout,
      S.con.acc,S.inc.acc,S.con.rt,S.inc.rt,S.effect].map(q).join(",")))});
  return "﻿"+out.join("\r\n");
}
async function download(text,name){
  try{const file=new File([text],name,{type:"text/csv"});
    if(navigator.maxTouchPoints>1&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return"shared"}
  }catch(e){if(e&&e.name==="AbortError")return"cancelled"}
  try{const blob=new Blob([text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return"downloaded"}catch(e){return"failed"}
}
async function saveWithStatus(text,name,what,msgId){
  const el=document.getElementById(msgId),say=(m,c)=>{if(el){el.textContent=m;el.className="feedback "+c}};
  say("Saving…","try");const r=await download(text,name);
  if(r==="shared")say(`✓ File for ${what} sent. Check that it shows up in OneDrive or Files.`,"good");
  else if(r==="downloaded")say(`✓ File for ${what} downloaded (${name}).`,"good");
  else if(r==="cancelled")say("✗ Not saved. The share menu was closed. Tap the button again and pick OneDrive or Save to Files.","try");
  else say("✗ The file could not be saved. Try again.","try");
  return r;
}

/* ================= VOICE (most natural voice on the device) ================= */
const PREFERRED=["Ava","Samantha","Allison","Susan","Zoe","Nicky","Evan","Tom"];let VOICE=null;
function scoreVoice(v){if(!/^en[-_]?/i.test(v.lang))return -1;let s=0;const n=v.name;
  if(/premium/i.test(n))s+=100;if(/enhanced/i.test(n))s+=80;if(/natural|neural|online/i.test(n))s+=70;if(/google us english/i.test(n))s+=60;
  const k=PREFERRED.findIndex(p=>n.startsWith(p));if(k>=0)s+=40-k;if(/en[-_]US/i.test(v.lang))s+=10;
  if(/compact|novelty|albert|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|bahh/i.test(n))s-=200;return s}
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(vs.length)VOICE=vs.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);
  if(!VOICE)pickVoice();if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang="en-US";u.rate=.9;s.speak(u)}catch(e){}}

setup();
</script>
