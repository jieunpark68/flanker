<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flanker and Card Sort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Flanker: same look as the Sentence Sense test for setup screens; dark, distraction-free screen for trials. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#16263D; --muted:#5A6B82; --line:#C9D7E8;
  --navy:#1D4E89; --sea:#5EC4F0; --good:#2F8A4A; --goodbg:#E3F4E7; --warn:#B4541F; --warnbg:#FCEBDD;
  --stage:#111827; --stageInk:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.5;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.5vw,40px);line-height:1.05;margin:0;color:var(--navy)}
h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--navy)}
.tag{font-family:var(--display);font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px;background:var(--navy);color:#fff}
.tag.practice{background:var(--good)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input{font-family:var(--read);font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.field input:focus{outline:3px solid var(--sea);outline-offset:1px}
.dob{display:flex;align-items:center;gap:8px}
.dob input{font-family:var(--read);font-size:22px;width:3.4em;text-align:center;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.dob input.yr{width:4.6em}
.dob span{font-size:22px;color:var(--muted)}
#dobMsg{color:var(--warn);font-weight:700}
.note{font-size:15px;color:var(--muted);margin:0}
.script{background:var(--bg);border-left:5px solid var(--navy);padding:12px 16px;border-radius:8px;font-size:19px;margin:0;flex:1;min-width:0}
.dirRow{display:flex;align-items:center;gap:12px}
.spkBig{font-size:28px;min-width:64px;min-height:64px;border-radius:16px;border:3px solid var(--navy);background:var(--bg);cursor:pointer;flex:none}
.demo{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.demoBox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--stage);color:#fff;border-radius:16px;padding:14px 20px}
.demoBox small{color:#cbd5e1;font-size:15px}
.arrowsSm{display:flex;gap:4px}
.arrowsSm svg{width:30px;height:30px}
.arrowsSm .mid{outline:3px solid var(--sea);outline-offset:3px;border-radius:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--display);font-weight:800;font-size:19px;min-height:52px;padding:6px 22px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.go{background:var(--good);border-color:var(--good);color:#fff}
.btn.small{font-size:14px;min-height:36px;padding:4px 12px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.examiner{border-top:1px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.feedback{font-size:18px;font-weight:700;border-radius:12px;padding:10px 14px;margin:0}
.feedback:empty{display:none}
.feedback.good{background:var(--goodbg);color:var(--good)}
.feedback.try{background:var(--warnbg);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.center{text-align:center}
.choicesNext{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bigchoice{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px}
.bigchoice small{font-family:var(--read);font-weight:400;font-size:15px;opacity:.9}

/* ---------- trial screen ---------- */
.stageBox{position:fixed;inset:0;background:var(--stage);color:var(--stageInk);display:flex;flex-direction:column;z-index:10;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.stageBox[hidden]{display:none}
.stageTop{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-family:var(--display);font-size:16px;color:#94a3b8}
.stageTop .pill{background:#1f2937;border-radius:999px;padding:2px 12px}
.stageMid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:0}
.arrows{display:flex;gap:clamp(6px,1.6vw,14px);min-height:clamp(56px,11vw,96px)}
.arrows svg{width:clamp(56px,11vw,96px);height:clamp(56px,11vw,96px)}
.fix{width:40px;height:40px;position:relative}
.fix::before,.fix::after{content:"";position:absolute;background:#fff;border-radius:2px}
.fix::before{left:17px;top:0;width:6px;height:40px}
.fix::after{top:17px;left:0;height:6px;width:40px}
.fix.red::before,.fix.red::after{background:#ef4444}
.fix.hide{visibility:hidden}
.msg{min-height:64px;font-size:clamp(20px,4vw,30px);font-weight:700;text-align:center;font-family:var(--read)}
.msg.ok{color:#4ade80}.msg.bad{color:#fbbf24}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 0 18px}
.resp button{min-height:clamp(110px,18vh,170px);border-radius:24px;border:4px solid #334155;background:#1f2937;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.resp button svg{width:clamp(64px,10vw,96px);height:clamp(64px,10vw,96px)}
.resp button:active,.resp button.pressed{background:#334155;border-color:var(--sea)}
.resp button[disabled]{opacity:.55}
.stopBtn{background:none;border:1px solid #334155;color:#94a3b8;border-radius:8px;font-size:13px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- card sort board ---------- */
.board{--gap:clamp(8px,2vw,18px);--cw:min(calc((100vw - 32px - 3*var(--gap))/4),calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 210px)/2.75),220px);
  display:flex;flex-direction:column;align-items:center;gap:var(--gap);margin:auto}
.keys,.drops{display:grid;grid-template-columns:repeat(4,var(--cw));gap:var(--gap)}
.drops{position:relative;height:calc(var(--cw)*1.33 + 52px)}
.keyCard{width:var(--cw);height:calc(var(--cw)*1.33);border:none;padding:0;background:none;cursor:pointer;border-radius:14px;touch-action:manipulation}
.keyCard svg,.pile svg,.drop svg{width:100%;height:100%;display:block}
.keyCard:active svg rect.bg,.keyCard.pressed svg rect.bg{stroke:var(--sea);stroke-width:6}
.keyCard[disabled]{cursor:default}
.drop{position:relative;width:var(--cw);height:calc(var(--cw)*1.33)}
.drop svg{height:calc(var(--cw)*1.33)}
.mark{position:absolute;left:50%;top:calc(var(--cw)*1.33 + 6px);transform:translateX(-50%);font-size:clamp(20px,3.6vw,32px);font-weight:800;font-family:var(--display);white-space:nowrap;
  background:rgba(17,24,39,.88);padding:2px 14px;border-radius:999px}
.mark.ok{color:#4ade80}.mark.bad{color:#f87171}
.pile{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--cw);height:calc(var(--cw)*1.33)}
.slow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,4vw,36px);color:#fbbf24;font-weight:800;font-family:var(--display)}
.prompt{min-height:28px;text-align:center;font-size:clamp(16px,2.6vw,21px);color:#cbd5e1;padding:0 8px 6px}
.demoCards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px}
.demoCards svg{width:100%;height:auto}
.demoCards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px}
.demoCards svg{width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap" id="page">
  <header>
    <div><span class="eyebrow">Sentence Sense</span><h1 id="title">Flanker &amp; Card Sort</h1></div>
    <span class="tag" id="modeTag" hidden></span>
  </header>
  <main id="screen"></main>
</div>

<!-- Flanker trial screen -->
<section id="fStage" class="stageBox" hidden>
  <div class="stageTop"><span class="pill" id="fInfo"></span><button class="stopBtn" id="fStop">Examiner: end early</button></div>
  <div class="stageMid">
    <div class="arrows" id="arrows"></div>
    <div class="fix hide" id="fix"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="resp"><button id="bL" aria-label="Left"></button><button id="bR" aria-label="Right"></button></div>
</section>

<!-- Card Sort trial screen -->
<section id="cStage" class="stageBox" hidden>
  <div class="stageTop"><span class="pill" id="cInfo"></span><button class="stopBtn" id="cStop">Examiner: end early</button></div>
  <div class="prompt" id="prompt"></div>
  <div class="board"><div class="keys" id="keys"></div><div class="drops" id="drops"></div></div>
</section>

<script>
/* =====================================================================
   PART 1: FLANKER (from the PsyToolkit task)
   4 stimuli, respond to the MIDDLE arrow. 2000 ms to respond, 500 ms between trials.
   ===================================================================== */
const FL_STIM=[
  {code:"LLLLL",dirs:"LLLLL",target:"left", cond:"congruent"},
  {code:"RRRRR",dirs:"RRRRR",target:"right",cond:"congruent"},
  {code:"RRLRR",dirs:"RRLRR",target:"left", cond:"incongruent"},
  {code:"LLRLL",dirs:"LLRLL",target:"right",cond:"incongruent"}
];
const FL={practiceTrials:8,testTrials:48,responseWindow:2000,iti:500,fixation:500,feedbackMs:900};

/* =====================================================================
   PART 2: CARD SORT (from the PsyToolkit WCST)
   4 key cards, 60 cards in a fixed order, rule changes every 10 cards:
   shape, number, color, shape, number, color. Feedback every card. 10 s limit.
   Each card: [shape, number, color, rule, correct key card, perseverative key card]
   ===================================================================== */
const KEYS=[["circle",1,"red"],["triangle",2,"green"],["cross",3,"blue"],["star",4,"yellow"]];
const CARDS=[
  ["star",2,"yellow","shape",4,0],
  ["star",1,"red","shape",4,0],
  ["triangle",1,"yellow","shape",2,0],
  ["star",1,"green","shape",4,0],
  ["star",1,"blue","shape",4,0],
  ["circle",1,"blue","shape",1,0],
  ["star",2,"red","shape",4,0],
  ["circle",2,"red","shape",1,0],
  ["triangle",2,"yellow","shape",2,0],
  ["circle",4,"green","shape",1,0],
  ["triangle",4,"green","number",4,2],
  ["triangle",3,"green","number",3,2],
  ["cross",3,"green","number",3,3],
  ["cross",4,"green","number",4,3],
  ["triangle",1,"green","number",1,2],
  ["cross",1,"blue","number",1,3],
  ["circle",3,"red","number",3,1],
  ["triangle",2,"blue","number",2,2],
  ["circle",4,"yellow","number",4,1],
  ["star",2,"blue","number",2,4],
  ["star",4,"green","color",2,4],
  ["star",4,"blue","color",3,4],
  ["cross",3,"red","color",1,3],
  ["circle",4,"red","color",1,4],
  ["cross",1,"red","color",1,1],
  ["triangle",3,"blue","color",3,3],
  ["cross",2,"green","color",2,2],
  ["triangle",1,"blue","color",3,1],
  ["triangle",1,"red","color",1,1],
  ["circle",4,"blue","color",3,4],
  ["cross",4,"yellow","shape",3,4],
  ["cross",3,"yellow","shape",3,4],
  ["cross",2,"red","shape",3,1],
  ["circle",3,"blue","shape",1,3],
  ["triangle",4,"yellow","shape",2,4],
  ["star",1,"yellow","shape",4,4],
  ["triangle",4,"red","shape",2,1],
  ["triangle",3,"red","shape",2,1],
  ["cross",1,"yellow","shape",3,4],
  ["circle",1,"green","shape",1,2],
  ["cross",2,"yellow","number",2,3],
  ["circle",2,"blue","number",2,1],
  ["star",3,"green","number",3,4],
  ["circle",3,"green","number",3,1],
  ["cross",4,"blue","number",4,3],
  ["star",4,"red","number",4,4],
  ["cross",4,"red","number",4,3],
  ["star",2,"green","number",2,4],
  ["cross",2,"blue","number",2,3],
  ["circle",2,"green","number",2,1],
  ["circle",3,"yellow","color",4,3],
  ["triangle",4,"blue","color",3,4],
  ["triangle",2,"red","color",1,2],
  ["star",3,"blue","color",3,3],
  ["star",3,"yellow","color",4,3],
  ["circle",1,"yellow","color",4,1],
  ["triangle",3,"yellow","color",4,3],
  ["star",3,"red","color",1,3],
  ["circle",2,"yellow","color",4,2],
  ["cross",1,"green","color",2,1]
];

const CS_PRACTICE=[["cross",3,"blue","all",3,0],["circle",1,"red","all",1,0],["star",4,"yellow","all",4,0]];
const CS={timeLimit:10000,beforeCard:1000,afterChoice:1000};

const TASKS={fl:{title:"Flanker",csv:"Flanker",part:1},cs:{title:"Card Sort",csv:"Card Sort",part:2}};

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function on(id,f){const e=document.getElementById(id);if(e)e.onclick=f}
const scr=$("#screen"),tag=$("#modeTag"),titleEl=$("#title"),fStage=$("#fStage"),cStage=$("#cStage");
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function ageMonths(dob,date){const a=new Date(dob),b=new Date(date);if(isNaN(a)||isNaN(b))return"";let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;return m}
function hideStages(){fStage.hidden=true;cStage.hidden=true}

/* ---------- drawings ---------- */
function arrowSVG(dir,color="#fff"){
  const flip=dir==="L"?' transform="scale(-1,1) translate(-100,0)"':"";
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g${flip}><path d="M10 42 H60 V22 L92 50 L60 78 V58 H10 Z" fill="${color}"/></g></svg>`;
}
const COLORS={red:"#E3262B",green:"#1E9E3E",blue:"#1F5FD6",yellow:"#F4C20D"};
const POS={1:[[50,50]],2:[[32,30],[68,70]],3:[[25,24],[50,50],[75,76]],4:[[30,27],[70,27],[30,73],[70,73]]};
function shapePath(shape,cx,cy,r){
  if(shape==="circle")return `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
  if(shape==="triangle")return `<polygon points="${cx},${cy-r} ${cx+r*1.05},${cy+r*.82} ${cx-r*1.05},${cy+r*.82}"/>`;
  if(shape==="cross"){const t=r*.38;return `<path d="M${cx-t} ${cy-r}h${2*t}v${r-t}h${r-t}v${2*t}h-${r-t}v${r-t}h-${2*t}v-${r-t}h-${r-t}v-${2*t}h${r-t}z"/>`}
  let p="";for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r*1.05;p+=`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)} `}
  return `<polygon points="${p}"/>`;
}
function cardSVG(shape,num,color){
  const r=num===1?17:num===2?13:11.5;
  const shapes=POS[num].map(([x,y])=>shapePath(shape,x,y*1.333,r)).join("");
  return `<svg viewBox="0 0 100 133" role="img" aria-label="${num} ${color} ${shape}${num>1?"s":""}">
    <rect class="bg" x="2" y="2" width="96" height="129" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <g fill="${COLORS[color]}" stroke="${color==="yellow"?"#A07800":"none"}" stroke-width="${color==="yellow"?1.2:0}">${shapes}</g></svg>`;
}
function cardName(c){return `${c[1]} ${c[2]} ${c[0]}${c[1]>1?(c[0]==="cross"?"es":"s"):""}`}

/* ---------- sounds for card sort feedback ---------- */
let AC=null;
function tone(kind){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const notes=kind==="good"?[[660,0],[880,.12]]:[[220,0],[180,.15]];
  notes.forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="good"?"sine":"square";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+dt);g.gain.exponentialRampToValueAtTime(kind==="good"?.25:.12,t+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.18);
    o.connect(g).connect(AC.destination);o.start(t+dt);o.stop(t+dt+.2)})}catch(e){}}

/* ================= STORAGE ================= */
const KEY="flanker-cardsort-sessions";
function backups(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function storeBackup(s){try{const b=backups().filter(x=>x.id!==s.id);b.push(s);localStorage.setItem(KEY,JSON.stringify(b));return backups().some(x=>x.id===s.id)}catch(e){return false}}
function clearBackups(){try{localStorage.removeItem(KEY)}catch(e){}}
function getDevice(){try{return localStorage.getItem("ss-device")||""}catch(e){return""}}
function setDevice(v){try{localStorage.setItem("ss-device",v)}catch(e){}}

/* ================= STATE ================= */
let session=null, plan=[], step=0, task="fl", phase="setup";
let list=[], idx=0, live=false, tOn=0, timer=null, stopArmed=false;

/* ================= SETUP ================= */
function setup(){
  phase="setup";tag.hidden=true;hideStages();titleEl.innerHTML="Flanker &amp; Card Sort";
  const today=localDate(), saved=backups();
  scr.innerHTML=`<section class="card">
    <h2>Student information</h2>
    <div class="row">
      <div class="field"><label for="fname">First name</label><input id="fname" autocomplete="off" autocapitalize="words"></div>
      <div class="field"><label for="lname">Last name</label><input id="lname" autocomplete="off" autocapitalize="words"></div>
    </div>
    <div class="field"><label for="dobM">Date of birth</label>
      <div class="dob">
        <input id="dobM" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Birth month" autocomplete="off"><span>/</span>
        <input id="dobD" inputmode="numeric" maxlength="2" placeholder="DD" aria-label="Birth day" autocomplete="off"><span>/</span>
        <input id="dobY" class="yr" inputmode="numeric" maxlength="4" placeholder="YYYY" aria-label="Birth year" autocomplete="off">
      </div>
      <span class="note" id="dobMsg"></span>
    </div>
    <div class="field"><label>Tasks to give</label>
      <div class="checks" style="display:flex;flex-direction:column;gap:6px">
        <label for="doFL" style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="doFL" checked style="width:22px;height:22px;accent-color:var(--navy)"> Part 1: Flanker (${FL.practiceTrials} practice + ${FL.testTrials} test)</label>
        <label for="doCS" style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="doCS" checked style="width:22px;height:22px;accent-color:var(--navy)"> Part 2: Card Sort (${CS_PRACTICE.length} practice + ${CARDS.length} test)</label>
      </div>
    </div>
    <p class="note">About 12 minutes for both. Turn the iPad sound on for Card Sort.</p>
    <div class="actions"><button class="btn primary" id="begin" disabled>Start</button></div>
    <div class="examiner">
      <label for="device">iPad number</label>
      <input id="device" autocomplete="off" maxlength="10" value="${esc(getDevice())}" placeholder="e.g. 7" style="width:5em;font-size:16px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)">
      <span style="flex:1"></span>
      <span>${saved.length} student${saved.length===1?"":"s"} saved on this iPad</span>
      <button class="btn small" id="eodBtn">End of the day</button>
    </div>
  </section>`;
  const fn=$("#fname"),ln=$("#lname"),go=$("#begin"),dM=$("#dobM"),dD=$("#dobD"),dY=$("#dobY"),dMsg=$("#dobMsg"),c1=$("#doFL"),c2=$("#doCS");
  const readDob=()=>{
    const m=dM.value,d=dD.value,y=dY.value;if(!m||!d||y.length<4){dMsg.textContent="";return""}
    const mm=+m,dd=+d,yy=+y,dt=new Date(yy,mm-1,dd);
    if(!(mm>=1&&mm<=12)||dt.getMonth()!==mm-1||dt.getDate()!==dd){dMsg.textContent="That date doesn't exist. Check the month and day.";return""}
    const age=(Date.now()-dt)/31557600000;
    if(age<3||age>14){dMsg.textContent="Check the year. This student would be "+Math.max(0,Math.floor(age))+" years old.";return""}
    dMsg.textContent="";return `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  };
  const ok=()=>go.disabled=!(fn.value.trim()&&ln.value.trim()&&readDob()&&(c1.checked||c2.checked));
  [fn,ln].forEach(e=>e.oninput=ok);c1.onchange=ok;c2.onchange=ok;
  [[dM,dD],[dD,dY],[dY,null]].forEach(([el,nx])=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"");if(nx&&el.value.length===el.maxLength)nx.focus();ok()}});
  go.onclick=()=>{
    tone("good"); // unlocks sound on iPad
    plan=[];if(c1.checked)plan.push("fl");if(c2.checked)plan.push("cs");
    const f=fn.value.trim(),l=ln.value.trim();
    session={id:Date.now().toString(36),first:f,last:l,dob:readDob(),date:today,device:getDevice(),
      start:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),status:{},practiceRounds:{fl:0,cs:0},trials:[]};
    step=0;beginTask();
  };
  const dev=$("#device");dev.oninput=()=>setDevice(dev.value.trim());
  on("eodBtn",showEndOfDay);
  fn.focus();
}

function flDemo(){

    <div class="demoBox">${row("RRLRR")}<small>Middle points left → tap <b>⬅</b></small></div></div>`;
}
function shuffleNoLongRuns(arr){
  for(let tries=0;tries<200;tries++){
    const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    let ok=true;for(let i=3;i<a.length;i++)if(a[i]===a[i-1]&&a[i]===a[i-2]&&a[i]===a[i-3]){ok=false;break}
    if(ok)return a;
  }return arr.slice();
}

function flButtons(en){$("#bL").disabled=!en;$("#bR").disabled=!en}
function flRun(which){

  setTimeout(()=>{

}
function flRespond(dir){

/* ================= SCORING ================= */
function flSummary(s){
  const t=s.trials.filter(x=>x.task==="fl"&&x.phase==="test");
  const by=c=>{const all=t.filter(x=>x.condition===c),ok=all.filter(x=>x.correct&&x.rt!=="");
    return{n:all.length,correct:all.filter(x=>x.correct).length,acc:all.length?Math.round(all.filter(x=>x.correct).length/all.length*100):"",
      rt:ok.length?Math.round(ok.reduce((a,x)=>a+x.rt,0)/ok.length):""}};
  const con=by("congruent"),inc=by("incongruent");
  return{n:t.length,con,inc,effect:(con.rt!==""&&inc.rt!=="")?inc.rt-con.rt:"",total:t.filter(x=>x.correct).length,timeouts:t.filter(x=>x.timeout).length};
}
function csSummary(s){
  const t=s.trials.filter(x=>x.task==="cs"&&x.phase==="test"),n=t.length,sum=f=>t.reduce((a,x)=>a+(x[f]||0),0),pct=v=>n?Math.round(v/n*1000)/10:"";
  const errors=sum("error"),pers=sum("persev"),nonpers=sum("nonpersev");
  return{n,correct:sum("correct"),errors,pers,nonpers,pctErrors:pct(errors),pctPers:pct(pers),pctNonPers:pct(nonpers),timeouts:sum("timeout"),
    sets:[1,2,3,4,5,6].map(k=>{const a=t.filter(x=>x.set===k);return{n:a.length,correct:a.filter(x=>x.correct).length,rule:a[0]?a[0].rule:""}})};
}

/* ================= CSV (one row per trial; task column tells Flanker and Card Sort apart) ================= */
function toCSV(sessions){
  const head=["first_name","last_name","dob","age_months","test_date","start_time","ipad","task","task_status","phase","practice_round","trial",
    "fl_stimulus","fl_condition","fl_target","fl_response",
    "cs_set","cs_trial_in_set","cs_rule","cs_card","cs_correct_choice","cs_perseverative_choice","cs_choice",
    "correct","rt_ms","timeout","cs_error","cs_perseverative_error","cs_nonperseverative_error",
    "fl_acc_congruent_pct","fl_acc_incongruent_pct","fl_rt_congruent_ms","fl_rt_incongruent_ms","fl_flanker_effect_ms",
    "cs_total_correct","cs_total_errors","cs_pct_errors","cs_persev_errors","cs_pct_persev_errors","cs_nonpersev_errors","cs_pct_nonpersev_errors"];
  const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const out=[head.join(",")];
  sessions.forEach(s=>{const F=flSummary(s),C=csSummary(s),st=s.status||{};
    const fSum=F.n?[F.con.acc,F.inc.acc,F.con.rt,F.inc.rt,F.effect]:["","","","",""];
    const cSum=C.n?[C.correct,C.errors,C.pctErrors,C.pers,C.pctPers,C.nonpers,C.pctNonPers]:["","","","","","",""];
    s.trials.forEach(t=>{const fl=t.task==="fl";
      out.push([s.first,s.last,s.dob,ageMonths(s.dob,s.date),s.date,s.start,s.device||"",TASKS[t.task].csv,st[t.task]||"",t.phase,t.round,t.trial,
        fl?t.stimulus:"",fl?t.condition:"",fl?t.target:"",fl?t.response:"",
        fl?"":t.set,fl?"":t.trialInSet,fl?"":t.rule,fl?"":t.card,fl?"":t.correctChoice,fl?"":t.persevChoice,fl?"":t.choice,
        t.correct,t.rt,t.timeout,fl?"":t.error,fl?"":t.persev,fl?"":t.nonpersev,...fSum,...cSum].map(q).join(","))})});
  return "﻿"+out.join("\r\n");
}
async function download(text,name){
  try{const file=new File([text],name,{type:"text/csv"});
    if(navigator.maxTouchPoints>1&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return"shared"}
  }catch(e){if(e&&e.name==="AbortError")return"cancelled"}
  try{const blob=new Blob([text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return"downloaded"}catch(e){return"failed"}
}
async function saveWithStatus(text,name,what,msgId){
  const el=document.getElementById(msgId),say=(m,c)=>{if(el){el.textContent=m;el.className="feedback "+c}};
  say("Saving…","try");const r=await download(text,name);
  if(r==="shared")say(`✓ File for ${what} sent. Check that it shows up in OneDrive or Files.`,"good");
  else if(r==="downloaded")say(`✓ File for ${what} downloaded (${name}).`,"good");
  else if(r==="cancelled")say("✗ Not saved. The share menu was closed. Tap the button again and pick OneDrive or Save to Files.","try");
  else say("✗ The file could not be saved. Try again.","try");
  return r;
}

/* ================= VOICE ================= */
const PREFERRED=["Ava","Samantha","Allison","Susan","Zoe","Nicky","Evan","Tom"];let VOICE=null;
function scoreVoice(v){if(!/^en[-_]?/i.test(v.lang))return -1;let s=0;const n=v.name;
  if(/premium/i.test(n))s+=100;if(/enhanced/i.test(n))s+=80;if(/natural|neural|online/i.test(n))s+=70;if(/google us english/i.test(n))s+=60;
  const k=PREFERRED.findIndex(p=>n.startsWith(p));if(k>=0)s+=40-k;if(/en[-_]US/i.test(v.lang))s+=10;
  if(/compact|novelty|albert|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|bahh/i.test(n))s-=200;return s}
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(vs.length)VOICE=vs.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);
  if(!VOICE)pickVoice();if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang="en-US";u.rate=.9;s.speak(u)}catch(e){}}

setup();
</script>
